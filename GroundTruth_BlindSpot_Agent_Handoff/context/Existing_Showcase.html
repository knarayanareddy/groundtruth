-03",domain:"Ukraine / Swarm",claimInBriefOrApp:"Standard RF jamming (EW) and pickup-truck machine-gun mobile fire groups remain sufficient against Shahed-136 and FPV drones.",verdict:"Corrected",verifiedReality:"By 2025–2026, Russia deployed: 1) Fiber-optic FPV drones (10–40 km spools) completely immune to RF jamming and invisible to RF spectrum detectors; 2) Shahed-136/238 cruising at 2,000–2,800m (above HMG ceiling) with 12-channel Kometa CRPA antennas and terminal vertical dives; 3) Wooden 'Parody' decoys with Luneberg lenses mimicking aircraft radar cross-sections alongside multi-role 'Gerbera' drones.",source:"ISW Technological Adaptations (Oct 2025) & ISIS Shahed Analysis (2026)",sourceUrl:"https://isis-online.org/isis-reports/monthly-analysis-of-russian-shahed-136-deployment-against-ukraine",architecturalImpact:"Air defense now hinges on acoustic/radar early detection (15–30 km out), decoy-vs-threat classification (preventing $9,000 Skynex rounds or SAMs from being wasted on $300 Parody decoys), and cueing $1,000–$2,500 AI/thermal interceptor drones (Sting, P1-SUN, Octopus)."},{id:"FC-04",domain:"Thermal ISP",claimInBriefOrApp:"hackreview claims its pipeline 'runs in ~640×4 = 2.5 KB of state on a real FPGA'.",verdict:"Nuanced / Caveat",verifiedReality:"While a 5-tap vertical filter needs 4 line buffers (~5.1 KB of uint16 BRAM at 640px width), percentile-based AGC and CLAHE require double-buffered histograms (or previous-frame quantile stats) plus bilateral weights. That is still tiny (~18–32 KB BRAM total, <2% of a Xilinx Artix-7 / Zynq-7020), which is a huge FPGA win—if stated accurately with exact bit-widths!",source:"Odd Systems 640×512 12µm 14-bit Challenge Spec",sourceUrl:"https://drive.google.com/file/d/1Z4FHhO6w2cMzRTY8cu92QtQUMSEsVYf1/view",architecturalImpact:"Provide an exact, honest FPGA BRAM + DSP48 + LUT resource breakdown showing line-streaming compatibility (1-frame statistical delay for temporal hysteresis AGC, 4-line rolling buffer for spatial detail)."},{id:"FC-05",domain:"Hardware / Atech",claimInBriefOrApp:"The owner's Atech boards, Raspberry Pi, LiteWing drone, and Go2 quadruped can form an autonomous LoRa/Meshtastic outdoor swarm out of the box.",verdict:"Corrected",verifiedReality:"Atech Frame 10 & Frame 2.1 are ESP32 modular boards that output newline-delimited JSON at 115200 baud over USB (offline) or via an Atech-hosted WebSocket over Wi-Fi. No LoRa radios, thermal cameras, or verified Go2 EDU ROS2 SDK access are confirmed in the photos.",source:"Atech Documentation & Hardware Photo Inspection",sourceUrl:"https://atech.dev/docs",architecturalImpact:"Use the Atech board + Button/LED/Display modules + Raspberry Pi over USB serial as a rock-solid, live physical 'BlindSpot / ProofLoop Edge Node' during the demo (unplug the cable live on stage to trigger FRESH → STALE → RECOVERED in Nexus/GTT), rather than risking an unverified drone flight."}],Tx=[{id:"WIN-01",name:"TRUSTLINE + GTT (Nexus Recon-to-Strike & Calibrated OSINT Extension)",origins:["GeoClick (hackreview)","NexusGeo (hack2ndrun)","TrustLine (hackideasreviewed)","OSINT Readiness Board (hackreview)","SignalCheck / GroundTruth (hack2ndrun)","Ground Truth Circle (benchmark repo)"],track:"Intelic Nexus",recommendation:"Headline Winner",scores:{rubricFit:9.8,weekendFeasibility:9,liveDemoImpact:9.6,differentiation:9.5,ukraineRelevance:9.7},summary:"Solves Intelic Nexus Example Problems #2 and #3 in one cohesive operator extension: clicking a target in drone video projects a 3D DEM-intersected ground coordinate with a full covariance error ellipse (separating along-range vs. cross-range error and naming the dominant error source), dynamically inflated by telemetry/OSINT staleness and corroborated by Brier-calibrated Ground Truth Circle field spotters.",criticalFlawInOriginal:"Earlier GeoClick/NexusGeo versions used a flat-earth Jacobian validated against itself, ignored roll/terrain/latency, and separated OSINT readiness into a disconnected tab ot effectively hit targets above 1,200–1,500m or during vertical dives. 2) Horizontal/ground-based GPS jammers require 12+ simultaneous emitters to overcome Kometa-M CRPA. 3) Helicopters (max ~250 km/h) cannot catch 550 km/h jet Geran-3s or cover 70 km corridors.",whatActuallyWorksOnFrontline:"Layered Acoustic + Distributed Radar Early Warning ('Sky Fortress' / 'Zvook' 10,000+ acoustic masts + Lanza/GM200 tactical radars) cueing $1,000–$2,500 high-speed AI/Thermal FPV Interceptor Drones ('Sting' by Wild Hornets, SkyFall 'P1-SUN' at 280 mph, 'ODIN', 'Octopus', 'Tytan') that climb to 3,000m and kinetically ram/detonate against Shaheds.",softwareAndSystemGap:"The 5-to-8 Minute Handoff & Decoy-Discrimination Bottleneck: A Shahed at 200 km/h (or Geran-3 at 550 km/h) gives interceptors only a 15–30 km reaction window. Operators lack an automated C2 layer that fuses acoustic harmonic signatures (2-stroke piston vs electric/foam decoy) + radar RCS anomaly + thermal exhaust plume to classify Decoy vs Strike Drone BEFORE expending an interceptor.",hackathonSolutionBlueprint:"Build 'INTERCEPT-CUE & PHALANX' on Intelic Nexus + Thermal ISP: Fuse acoustic/radar/OSINT probability to filter Parody decoys, auto-compute 3D climb-intercept vectors for $1,500 thermal interceptor drones, and run the ClearHot 14-bit ISP pipeline for terminal thermal lock in cold cloud clutter.",sources:[{label:"ISIS Monthly Shahed-136 Analysis (Aug 2025 – Oct 2026)",url:"https://isis-online.org/isis-reports/monthly-analysis-of-russian-shahed-136-deployment-against-ukraine-updated"},{label:"Military Times – Ukraine's $1,000 Interceptor Drones (Sting & P1-SUN, 2026)",url:"https://www.militarytimes.com/news/pentagon-congress/2026/03/11/these-are-ukraines-1000-interceptor-drones-the-pentagon-wants-to-buy/"},{label:"Euromaidan Press / Texty – High-Altitude Dives & Parody Decoys",url:"https://euromaidanpress.com/2025/06/29/why-cant-ukraine-stop-russias-shahed-drones-anymore/"}]},{id:"UKR-02",title:"Fiber-Optic FPV Drones (10–40 km Spools) & Airborne Mothership Repeaters (Orlan / Molniya)",timeframe:"Late 2024 – 2026 Frontline Nightmare (Pokrovsk, Kursk, Kharkiv, Lyman)",russianAdaptation:"To defeat Ukrainian trench EW domes, Russia scaled fiber-optic FPV drones ('Knyaz Vandal', 'Upyr', fiber-tethered 'Molniya-2') unreeling hair-thin glass fiber spools up to 20–40 km, plus fixed-wing motherships carrying FPVs 40–60 km into the Ukrainian near-rear logistics zone.",impactOnSoldiersAndCivilians:"Creates a terrifying 20–30 km 'dead zone' along supply roads (GLOCs), medevac routes, and artillery hides. Because the drone emits ZERO radio frequency control signals and receives pristine 1080p video down to 0 meters above the ground, soldiers' RF spectrum detectors ('Tsukorok') stay completely silent until impact, and vehicle EW jammers do nothing.",whatCurrentlyFails:"1) All RF-based drone detectors/analyzers (cannot detect passive glass fiber). 2) All omnidirectional & directional RF jammers. 3) Static concealment inside tree lines or buildings (zero multipath video breakup at ground level allows fiber FPVs to fly inside bunkers and under netting).",whatActuallyWorksOnFrontline:"1) Distributed directional acoustic microphone arrays + edge FFT (detecting the distinct high-RPM 4-blade acoustic signature under heavy spool payload at 400–800m). 2) Short-range mmWave/micro-Doppler radar & wide-FOV thermal/optical motion detection. 3) Physical tunnel anti-drone netting over supply roads + autonomous turret/shotgun point defense + trailing fiber-spool localization (following the sun-glint or physical fiber trace back to the launch crew).",softwareAndSystemGap:"RF-Confirmation Bias in C2 Systems: Existing C2 dashboards treat 'No RF Detection' as 'No Drone Present'. When an acoustic sensor or human spotter reports an FPV with zero RF correlate, naive sensor fusion discounts it instead of raising a high-priority 'SILENT-RF / FIBER-OPTIC FPV ALERT'!",hackathonSolutionBlueprint:"Build the 'FIBER-SHIELD / SILENT-RF DETECTOR' rule inside Nexus & Ground Truth Tactical: When Acoustic + Optical/Human Spotter trigger along a logistics corridor while RF Spectrum Node reports clean 0 dBm baseline, classify as High-Probability Fiber-Optic Threat, alert road convoys along the vector, and back-project the 20 km spool radius to locate the launch nest.",sources:[{label:"ISW Technological Adaptations Update (Oct 9, 2025 – Fiber-Optic Molniya & Motherships)",url:"https://understandingwar.org/research/russia-ukraine/russian-force-generation-technological-adaptations-update-october-9-2025/"},{label:"DWIM Quarterly Q1 2026 – Hybrid Fiber-Optic & Dual-Control FPVs",url:"https://drone-warfare.com/2026/04/03/dwim-quarterly-q1-2026/"}]},{id:"UKR-03",title:"Wide-Area GNSS Spoofing ('Pokrova') vs. Friendly Drone Loss & Telemetry Corruption",timeframe:"2024–2026 Electronic Warfare Saturation",russianAdaptation:"Both sides blankets the frontline and major cities with continuous GNSS spoofing (teleporting receivers hundreds of kilometers away or inducing velocity/clock drift) alongside multi-band barrage jamming.",impactOnSoldiersAndCivilians:"Friendly reconnaissance drones lose GPS lock or suffer sudden EKF (Extended Kalman Filter) position jumps right when an operator clicks a target on video. A 3° gimbal pitch bias or 150m spoofed GPS jump shifts a strike coordinate by 400+ meters—risking fratricide or civilian harm.",whatCurrentlyFails:"Point-and-click video geolocation tools that output a single 'pin' on the map assuming MAVLink GPS lat/lon and magnetometer yaw are ground truth.",whatActuallyWorksOnFrontline:"Visual-Inertial Odometry (VIO), terrain/landmark matching against offline satellite orthophotos, cross-checking barometric vs radar altimeter vs DEM elevation, and propagating honest covariance ellipses that automatically downgrade handoff status from 'STRIKE-QUALITY' to 'CUE-ONLY / NEEDS LANDMARK LOCK' when GNSS/IMU divergence is detected.",softwareAndSystemGap:"Exactly Intelic Nexus Example Problem #2: Operators under bunker stress need immediate visual feedback showing how GNSS spoofing or gimbal uncertainty stretches the target error ellipse and blocks accidental kinetic handoff until corroborated.",hackathonSolutionBlueprint:"Directly implemented in our Prototype 1 (TRUSTLINE v2): Real-time covariance propagation that monitors GNSS-vs-VIO divergence and telemetry age, rendering the exact 95% CEP ellipse and dominant error contributor.",sources:[{label:"Defence Ukraine – Pokrova EW & Counter-Drone Innovation",url:"https://www.defenceukraine.com/en/insights/ukraine-counter-drone-innovation-electronic-warfare/"}]},{id:"UKR-04",title:"Remote Aerial Mine-Laying (PTM-3 / PFM-1) & Camera-Guided Shahed Strikes on Moving Trains/Convoys",timeframe:"Late 2025 – 2026 Rear-Area Logistics Interdiction",russianAdaptation:"Shahed-MS and Gerbera UAVs equipped with thermal cameras and radio/mesh relays now hunt moving locomotives (e.g., Chernihiv Oblast strikes) and drop PTM-3 magnetic anti-tank mines and PFM-1 'Lepestok' anti-personnel mines along rear highways and rail lines at night.",impactOnSoldiersAndCivilians:"First responders, repair crews, farmers, and logistics trucks driving down a road 30 minutes after a Shahed wave passes overhead hit newly dropped magnetic mines because air-defense tracking maps delete drone tracks once the drone leaves the sector.",whatCurrentlyFails:"Air defense C2 treats a drone overflight that didn't explode in a city as a 'harmless transit', failing to convert low-altitude slows/drops over roads and railways into persistent ground-hazard zones for logistics and EOD teams.",whatActuallyWorksOnFrontline:"Correlating low-altitude UAV flight paths + acoustic drop signatures with highway/railway GIS layers, followed by thermal drone road scanning at dawn (mines heat/cool differently than asphalt).",softwareAndSystemGap:"No automated bridge between Air Defense track logs (Nexus/Virage) and Ground Logistics / EOD hazard maps.",hackathonSolutionBlueprint:"A high-impact Nexus Extension ('CORRIDOR-CLEAR'): Automatically intersects enemy UAV overflight tracks with critical rail/road infrastructure corridors, flags segments where altitude/speed anomalies suggest cassette mine release, and tasks a ClearHot thermal drone sweep before opening the route to morning traffic.",sources:[{label:"ISW Oct 2025 – Shahed-MS Moving Locomotive Strikes & Aerial PTM-3/Lepestok Mining",url:"https://understandingwar.org/research/russia-ukraine/russian-force-generation-technological-adaptations-update-october-9-2025/"}]},{id:"UKR-05",title:"European Hybrid Subsea Sabotage & Shadow-Fleet Anchor Dragging (Baltic & North Sea)",timeframe:"2022–2026 (Samus Swan, NewNew Polar Bear, Yi Peng 3, Eagle S)",russianAdaptation:"Hybrid shadow-fleet tankers and cargo vessels drag multi-ton anchors across Baltic power interconnectors (Estlink 2, Bornholm–Sweden MVAC), gas pipelines (Balticconnector), and telecom cables (C-Lion1) for 15–100+ km while maintaining 'plausible deniability' (claiming mechanical anchor release in rough seas) and sailing at 6–10 knots.",impactOnSoldiersAndCivilians:"Drops gigawatt-scale regional electricity links and international internet backbones in seconds; repairs take months and tens of millions of euros; legal attribution fails in court (e.g. Eagle S Oct 2025 jurisdiction dismissal) unless intercepted in the act by coastal ISR/patrol assets.",whatCurrentlyFails:"Retrospective forensics days after the cable breaks, or naive AIS speed-threshold alerts (<4 knots) that drown operators in 200+ daily false alarms from trawlers, anchorage drift, and ferries while missing a 9.5-knot tanker dragging anchor under engine power.",whatActuallyWorksOnFrontline:"Contextual baseline modeling (comparing a vessel's speed against its own 6-hour rolling median and the learned lane × vessel-class distribution + COG-vs-heading crabbing + AIS dropout proximity to EMODnet cable corridors) coupled with dynamic moving-target ISR drone routing.",softwareAndSystemGap:"Exactly the Mantavia Challenge: turning noisy public AIS into low-burden, causal behavioral episodes ranked by time-to-cable-crossing and interceptability by a single 1-hour endurance ISR asset.",hackathonSolutionBlueprint:"Directly implemented in our Prototype 2 (CABLEGUARD v2 Causal Engine).",sources:[{label:"EJIL:Talk! – Baltic Sea Cable Cuts & Jurisdiction",url:"https://www.ejiltalk.org/christmas-day-cable-cuts-in-the-baltic-sea/"},{label:"TGS 4C – Bornholm–Sweden MVAC Cable Fault",url:"https://www.tgs4c.com/news/failure-occurred-on-mvac-cable-connecting-bornholm-and-sweden-nid25074.html"}]}],op=[{moduleFile:"src/lib/scoring.ts (Brier Calibration & Domain Reliability)",originalAcapsFunction:"Tracks each humanitarian expert's historical probability forecasts against resolved ground truth using Brier scores (0.00 = perfect, 0.25 = coin-flip) and weights their input by domain/country track record.",tacticalDefenseEquivalent:"Dynamic Sensor & Human Spotter Reliability Weighting (Brier-Calibrated Trust)",ukraineOperationalUseCase:"In Ukraine, thousands of civilians report Shaheds via the ePPO app and hundreds of acoustic/RF nodes stream alerts. Some spotters mistake civilian mopeds or friendly drones for Shaheds; some sensors drift. `scoring.ts` automatically weights each spotter and hardware node by its historical verified hit/false-alarm calibration curve!",nexusAndChallengeIntegration:"Directly powers the Intelic Nexus OSINT & Sensor Trust Layer: instead of arbitrary 'confidence = 80%', every OSINT source and Atech sensor carries an auditable calibration score."},{moduleFile:"src/lib/integrity.ts (Sybil, Burst & Collusion Detection)",originalAcapsFunction:"Detects coordinated manipulation in expert panels: temporal submission bursts (3+ posts in <10 min), copy-paste text similarity, and single-day velocity spikes.",tacticalDefenseEquivalent:"Adversarial OSINT Anti-Spoofing & Russian Bot-Farm / Replay-Attack Detector",ukraineOperationalUseCase:"Russian psyops and EW units flood Telegram channels and civil reporting apps with coordinated fake drone sightings from multiple spoofed accounts to pull Ukrainian Mobile Fire Groups and interceptor drones away from the real strike corridor.",nexusAndChallengeIntegration:"Flags coordinated OSINT injection attacks in Nexus before an operator wastes a limited-endurance ISR drone or interceptor on a phantom decoy corridor!"},{moduleFile:"src/lib/privacy.ts & src/lib/scrub.ts (3-Tier OPSEC Anonymity & PII Scrubber)",originalAcapsFunction:"Enforces 3 strict attribution tiers (`ghost`, `pseudonym`, `named`) and automatically scrubs phone numbers, emails, coordinates, and self-identifying phrases so front-line humanitarian workers cannot be targeted.",tacticalDefenseEquivalent:"Partisan / Occupied-Territory Informant & Mobile-Fire-Group OPSEC Shield",ukraineOperationalUseCase:"Ukrainian resistance spotters in occupied territories (Crimea, Zaporizhzhia, Donetsk) reporting Russian S-400 movements or Shahed launch sites face lethal retaliation if metadata, callsigns, or exact house vantage angles leak into shared C2 screens.",nexusAndChallengeIntegration:"Automatically scrubs identifying callsigns/metadata at the edge and fuzzes spotter origin into a safe sector polygon while preserving the target vector and Brier trust weight in Nexus."},{moduleFile:"src/lib/synthesis.ts & src/components/Roundtable.tsx (Agreement vs. Dissent Loop)",originalAcapsFunction:"Separates expert consensus from high-credibility minority dissent ('Second Look') so analysts don't fall victim to groupthink when a well-calibrated local expert disagrees with the majority.",tacticalDefenseEquivalent:"Multi-Modal Sensor Dissent Engine (Acoustic vs. Radar vs. RF Disagreement)",ukraineOperationalUseCase:"Radar sees a massive aircraft-sized RCS return (suggesting a high-priority target), while a well-calibrated Acoustic node hears a tiny 2-stroke moped engine (dissent: 'This is a $300 wooden Parody decoy with a Luneberg reflector, DO NOT fire a Patriot/IRIS-T missile!').",nexusAndChallengeIntegration:"Implements the 'Interrupted Only When Human Needed' criterion in Nexus: auto-approves high-consensus tracks, and surfaces structured Dissent Cards when high-calibration modalities contradict each other."},{moduleFile:"src/lib/dispatch.ts (Targeted Micro-Tasking & Weekly Cap / Fatigue Guard)",originalAcapsFunction:"Matches incoming risk triggers to the highest-fit available experts while enforcing a strict notification cap so contributors never burn out.",tacticalDefenseEquivalent:"Cognitive-Load & Alarm-Fatigue Budgeter for Bunker Operators & Mobile Fire Groups",ukraineOperationalUseCase:"During a 300-drone overnight raid, operators in a bunker suffer severe alarm fatigue if every unverified ping chimes. `dispatch.ts` enforces a strict interruption budget—routing verification micro-asks only to the sector unit with line-of-sight and available ammo.",nexusAndChallengeIntegration:"Directly satisfies Intelic Nexus UI/UX Success Criterion #2 ('Reduce cognitive load and alarm fatigue, design as if they're in a bunker under attack')."}],up=[{id:"IDEA-A",codename:"NEXUS AEGIS-LITE",title:"TrustLine + Ground Truth Tactical + Live Atech Hardware BlindSpot Bridge",targetTrack:"Intelic Nexus (Bridges Example Problems #2 & #3 + Hardware)",oneLinePitch:"Turn drone video clicks and noisy OSINT/field sensors into mathematically honest, spoofing-resistant target handoffs with live hardware failure injection.",ukraineProblemSolved:"Solves GNSS spoofing target-shift errors, Russian Telegram/OSINT decoy flooding, and silent/dead edge sensors being misread as 'sector clear'.",whyJudgesPickIt:"Hits 100% of the Intelic Nexus rubric (honest error ellipse that holds up under Monte Carlo, explicit OSINT staleness/readiness effect on the ellipse, bunker-proof Hold-to-Confirm + Undo UX, and a live physical Atech USB unplug moment on stage).",weekendArchitecture:["Module 1 (Pure TS/Python Math): 3D ray-DEM intersection + analytical Jacobian + unmodeled roll/terrain Monte Carlo validator.","Module 2 (Benchmark Repo Engine): Port `scoring.ts` (Brier trust), `integrity.ts` (anti-spoofing burst check), and `synthesis.ts` (sensor dissent card) as the Nexus OSINT Readiness layer.","Module 3 (Live Hardware Flourish): Connect Atech Frame 10 + Button + LED over USB serial (115200 baud) to Raspberry Pi / Mac; unplug cable during pitch to show immediate FRESH → STALE/UNKNOWN covariance expansion."],hardwareAndBenchmarkTieIn:"Uses `benchmark` repo's exact calibration & integrity logic + your physical Atech board & LiteWing drone IMU tilt.",feasibilityScore:9.5,impactScore:9.8},{id:"IDEA-B",codename:"FIBER-WATCH & STING-CUE",title:"Silent-RF Fiber-Optic FPV Detector & Anti-Shahed Decoy Triage Extension",targetTrack:"Intelic Nexus OR Open/Independent Track",oneLinePitch:"Detect unjammable fiber-optic FPVs by their 'Acoustic-Positive / RF-Zero' signature and stop air defenses from wasting missiles on wooden Parody decoys.",ukraineProblemSolved:"Directly addresses the two #1 frontline crises in Ukraine (2025–2026): 20–40 km fiber-optic FPVs terrorizing logistics roads while RF detectors stay silent, and Luneberg-lens Parody decoys exhausting air-defense ammunition.",whyJudgesPickIt:"Frontline mentors at EDTH will immediately recognize this as a real 2025–2026 combat problem—not a generic textbook drone map.",weekendArchitecture:["Multi-Modal Dissent Classifier: Contrasts Radar RCS vs. Acoustic Harmonic Signature vs. RF Spectrum Baseline.","Fiber-Optic Back-Projection: When an Acoustic-Positive + RF-Zero event triggers along a road corridor, draws the 20 km fiber-spool launch arc and alerts logistics vehicles on that road.","Interceptor Matcher: Assigns $1,500 Sting/P1-SUN thermal interceptor drones to verified Shaheds while logging Parody decoys as 'PASSIVE WATCH - DO NOT ENGAGE WITH SAM'."],hardwareAndBenchmarkTieIn:"Uses `benchmark`'s dissent engine (`synthesis.ts`) + Atech physical button/potentiometer to simulate acoustic vs RF node inputs live.",feasibilityScore:9.2,impactScore:9.9},{id:"IDEA-C",codename:"CABLEGUARD CAUSAL",title:"Zero-Leakage Subsea Anchor-Drag Episode Detector & Dynamic ISR Intercept Planner",targetTrack:"Mantavia Subsea AIS Challenge",oneLinePitch:"Catch the 26 Feb 2022 Samus Swan cable drag 43 minutes before impact without drowning the operator in trawler false alarms, and route a 1-hr ISR drone to moving vessels.",ukraineProblemSolved:"Protects Baltic & European power interconnectors and communications cables from Russian 'shadow fleet' hybrid anchor-dragging sabotage.",whyJudgesPickIt:"Fixes the fatal flaws that sink 90% of Mantavia teams: 1) Doesn't rely on a naive <4 kn speed gate (which misses Samus Swan at 9.5 kn); 2) Has zero future-data leakage; 3) Solves moving-target vector interception for the 25 m/s ISR drone; 4) Runs any judge-selected date in 7–16 Sep 2026 in one click with a frozen config hash.",weekendArchitecture:["Pre-download all 10 DMA AIS daily ZIPs (7–16 Sep 2026) + Feb 2022 Bornholm archive and convert cropped 54.5°–56.0°N, 13.5°–16.0°E bbox to fast Parquet files before the hackathon.","Causal Prefix Detector: Evaluates relative speed drop vs vessel 6h baseline + COG-heading crabbing + EMODnet cable buffer proximity strictly on `t <= now`.","Lead-Pursuit ISR Scheduler: Solves `|P_vessel(t) + V_vessel * dt - P_drone| = 25 m/s * dt` with hard return-to-base battery constraint."],hardwareAndBenchmarkTieIn:"Uses `benchmark`'s analyst handover & second-look verification cards so every alert explicitly frames behavior to verify rather than a legal verdict.",feasibilityScore:9.4,impactScore:9.5},{id:"IDEA-D",codename:"CLEARHOT STREAM-14",title:"FPGA-Ready Line-Streaming 14-Bit Microbolometer ISP for Low-Cost Night Interceptors",targetTrack:"The Fourth Law / Odd Systems Thermal ISP Challenge",oneLinePitch:"Turn flat 14-bit post-NUC microbolometer dumps into rock-steady, flicker-free, zero-halo 8-bit white-hot video using <24 KB of streaming line buffers.",ukraineProblemSolved:"Ukraine's $1,000–$2,500 night interceptor drones (Sting, P1-SUN) rely on cheap uncooled 640×512 12µm thermal cores. When the drone pitches across the horizon or passes a burning target, naive AGC washes out the sky or flickers wildly, losing terminal lock on the Shahed.",whyJudgesPickIt:"Every step in the 4-stage pipeline maps 1-to-1 to the four defects in the judging rubric (Flicker → Temporal Hysteresis Quantile AGC; Lost Scene → Dual-Plateau Local Contrast; Ghosting → Pure Spatial Denoise with Zero IIR Frame Blending; Halos/Stripes → Column Median Destripe + Edge-Preserving Bilateral).",weekendArchitecture:["Browser + Python/C++ dual implementation reading the exact headerless 640×512 uint16 little-endian .bin file.","Interactive Before/After Wipe, Temporal Quantile Stability Graph, and FPGA BRAM/DSP48 Line-Streaming Proof.","One-command CLI script that exports lossless 25 fps 8-bit white-hot MP4 sequences plus resource benchmark table."],hardwareAndBenchmarkTieIn:"Can stream processed 8-bit frames into the Nexus video-to-strike TrustLine extension as a cross-challenge bonus!",feasibilityScore:9.1,impactScore:9.4},{id:"IDEA-E",codename:"PHALANX RED-TEAM LAB",title:"Automated Adversarial Failure-Boundary Discovery & Sim-to-Field Evidence Pack for Counter-UAS Swarms",targetTrack:"Own Challenge / Open Track (or Intelic Nexus Swarm Extension)",oneLinePitch:"Don't just demo a drone swarm working in happy-path simulation—automatically map the exact EW jamming × decoy ratio boundary where it fails, inject real hardware faults, and export a buyer-verifiable safety report.",ukraineProblemSolved:"Addresses the #1 bottleneck cited by Brave1 and Ukrainian interceptor teams: algorithms that work in clean SITL fail in the field when Russia changes decoy ratios, cruising altitudes, or Kometa-M jamming every 8 weeks.",whyJudgesPickIt:"Directly fulfills your t
